<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | GearBari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">

  <!-- For PDF generation (print invoice) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <div class="gb-spotlight" aria-hidden="true"></div>

  <!-- ========== NAVBAR ========== -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top border-bottom border-secondary py-3">
    <div class="container">
      <a class="navbar-brand fw-bold fs-3" href="index.html">Gear<span>Bari</span></a>
      <div class="d-flex gap-2 align-items-center ms-auto">
        <a class="btn btn-outline-light btn-sm" href="index.html"><i class="bi bi-shop"></i> Continue Shopping</a>
        <button class="btn btn-outline-danger btn-sm" id="logout-btn"><i class="bi bi-box-arrow-right"></i> Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">

    <!-- Logged-out state -->
    <div id="logged-out-state" class="gb-empty-state d-none">
      <i class="bi bi-lock fs-1 mb-3 d-block"></i>
      <h4>You're not logged in</h4>
      <p>Please login or place an order to see your account here.</p>
      <a href="index.html" class="btn btn-warning fw-bold mt-2">Back to GearBari</a>
    </div>

    <!-- Logged-in account view -->
    <div id="account-view" class="d-none">
      <div class="gb-account-hero d-flex align-items-center gap-3">
        <div class="gb-account-avatar" id="account-avatar">?</div>
        <div>
          <div class="gb-account-name" id="account-name">-</div>
          <div class="gb-account-meta"><i class="bi bi-telephone-fill"></i> <span id="account-phone">-</span></div>
        </div>
      </div>

      <div id="just-ordered-banner" class="alert alert-success d-none" role="alert">
        <i class="bi bi-check-circle-fill"></i> Your order has been placed successfully! Details are highlighted below.
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0"><i class="bi bi-box-seam"></i> Order History</h5>
      </div>

      <div id="orders-list">
        <!-- Filled dynamically -->
      </div>
    </div>

  </div>

  <footer class="gb-footer">
    GearBari <span class="dot">&bull;</span> Authentic tech, delivered <span class="dot">&bull;</span> &copy; <span id="gb-year"></span>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="account.js"></script>
  <script>
    document.getElementById('gb-year').textContent = new Date().getFullYear();
    document.addEventListener('mousemove', function (e) {
      document.documentElement.style.setProperty('--mx', e.clientX + 'px');
      document.documentElement.style.setProperty('--my', e.clientY + 'px');
    });
  </script>
</body>
</html>
